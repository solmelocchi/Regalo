<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07050A">
<meta name="robots" content="noindex, nofollow">
<title>THE BIRTHDAY EXPERIENCE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>

<div class="bg-aura" aria-hidden="true"></div>
<canvas class="bg-particles" id="fx-particles" aria-hidden="true"></canvas>
<div class="bg-vignette" aria-hidden="true"></div>
<div class="bg-grain" aria-hidden="true"></div>

<header class="hud" id="hud" data-visible="false">
  <p class="hud__brand">The Birthday Experience</p>

  <div class="hud__center">
    <p class="hud__chapter" id="hud-chapter"></p>
    <div class="hud__track" role="progressbar" aria-label="Progreso de la experiencia" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="hud-bar">
      <span class="hud__fill" id="hud-fill"></span>
    </div>
  </div>

  <button class="sound" id="sound-toggle" type="button" aria-pressed="false" aria-label="Activar música">
    <span class="sound__bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  </button>
</header>

<main class="stage" id="stage" tabindex="-1"></main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="curtain" id="curtain" aria-hidden="true">
  <span class="curtain__panel curtain__panel--top"></span>
  <span class="curtain__panel curtain__panel--bottom"></span>
  <span class="curtain__sweep"></span>
</div>
<div class="flash" id="flash" aria-hidden="true"></div>

<script src="config.js"></script>
<script src="js/core/dom.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/core/fx.js"></script>
<script src="js/core/router.js"></script>
<script src="js/screens/intro.js"></script>
<script src="js/screens/senses.js"></script>
<script src="js/screens/enigma.js"></script>
<script src="js/screens/word.js"></script>
<script src="js/screens/reveal.js"></script>
<script src="js/screens/vault.js"></script>
<script src="js/screens/finale.js"></script>
<script src="js/main.js"></script>
</body>
</html>
